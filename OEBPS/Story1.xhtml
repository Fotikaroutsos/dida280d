<h1 class="Base head_one Title">The Red Wheel Barrow</h1>
<h1 class="Base head_one Heading_3 author"><em>William Carlos Williams</em></h1>
<p class="Base Body poem">so much depends</p>
<p class="Base Body poem">upon </p>
<p class="Base Body poem">a red wheel </p>
<p class="Base Body poem">barrow</p>
<p class="Base Body poem">glazed with rain</p>
<p class="Base Body poem">water</p>
<p class="Base Body poem">beside the white</p>
<p class="Base Body poem">chickens</p>
